name: Release

# Builds and publishes the `utos` binaries for a release tag, from this repository's own source, so
# the run that produced them is public and every archive carries a signed provenance attestation
# that names it: `gh attestation verify <archive> --owner utos`.
#
# Only a tag starts it, and the tag is created by the Utos release, which decides the version and
# which components carry it. A push to a branch never publishes.
#
# NativeAOT cannot cross-compile, so every target needs its own runner.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: The version this tag releases
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          grep -qE "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated heading for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The SDK the CLI pins may be released by the same Utos release, minutes ago, and not be
      # listed on nuget.org yet.
      - name: Wait for the pinned SDK packages
        run: |
          set -euo pipefail
          grep -oE 'Include="Utos\.[^"]*" Version="[^"]*"' Directory.Packages.props \
            | sed -E 's/Include="([^"]*)" Version="([^"]*)"/\1 \2/' | while read -r name version; do
              url="https://api.nuget.org/v3-flatcontainer/${name,,}/${version}/${name,,}.${version}.nupkg"
              for _ in $(seq 1 90); do
                curl -sfI "$url" > /dev/null && { echo "$name $version is available"; continue 2; }
                sleep 20
              done
              echo "::error::$name $version is not on nuget.org after 30 minutes"; exit 1
            done

  build:
    needs: version
    strategy:
      fail-fast: false   # a broken platform should not hide the state of the others
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest,   archive: zip }
          - { rid: linux-x64,   os: ubuntu-latest,    archive: tar }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, archive: tar }
          # Apple silicon cannot produce an x64 binary. .NET pins the macOS deployment target
          # itself, so the Intel image is chosen only for how long it has before retirement — a
          # job asking for a retired label queues forever rather than failing.
          - { rid: osx-x64,     os: macos-26-intel,   archive: tar }
          - { rid: osx-arm64,   os: macos-latest,     archive: tar }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install native toolchain (Linux)
        if: startsWith(matrix.rid, 'linux')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish ${{ matrix.rid }}
        run: dotnet publish src/Utos.Cli/Utos.Cli.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ needs.version.outputs.version }}

      # Each runner is native to its target, so the binary it built can run: AOT failures that
      # only appear at run time show up here.
      - name: Smoke test
        run: |
          set -euo pipefail
          BIN="src/Utos.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/utos"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then BIN="${BIN}.exe"; fi
          "$BIN" --version
          "$BIN" validate tests/smoke/smoke.yaml
          "$BIN" inspect tests/smoke/smoke.yaml
          "$BIN" context ls

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          RID="${{ matrix.rid }}"
          SRC="src/Utos.Cli/bin/Release/net10.0/${RID}/publish"
          STAGE=$(mktemp -d)
          OUT="$PWD/dist"
          mkdir -p "$OUT"
          # The binary, the licence and the readme; not the .pdb/.dbg.
          if [ "$RID" = "win-x64" ]; then cp "$SRC/utos.exe" "$STAGE/"; else cp "$SRC/utos" "$STAGE/"; fi
          cp README.md CHANGELOG.md "$STAGE/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$STAGE" && 7z a -tzip "$OUT/utos-${VERSION}-${RID}.zip" .) > /dev/null
          else
            tar -czf "$OUT/utos-${VERSION}-${RID}.tar.gz" -C "$STAGE" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: utos-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the GitHub release
      id-token: write       # signing the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="## [$VERSION]" 'index($0, v) == 1 { grab = 1; next } /^## \[/ && grab { exit } grab { print }' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
          fi
