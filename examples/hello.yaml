apiVersion: utos.io/v1
kind: Workflow
metadata:
  name: hello
  version: "1.0.0"
  description: The smallest useful workflow — one HTTP call and a decision.
spec:
  activities:
    greet:
      type: http
      method: GET
      url: "{{ env.API_BASE }}/hello/{{ input.name }}"
      headers:
        accept: application/json
      onSuccess:
        # A condition is a bare expression; `return:` with no value ends the run.
        - condition: output.ok
          return:
        - return:
            greeted: false
            reason: "{{ output.error }}"
      onFailure:
        # Fail with a reason of your own; `error.message` quotes the cause.
        - error:
            code: GREETING_FAILED
            message: "hello service said {{ response.status }}: {{ error.message }}"
